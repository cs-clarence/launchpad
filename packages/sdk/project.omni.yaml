# yaml-language-server: $schema=https://raw.githubusercontent.com/omni-oss/json-schemas/refs/heads/main/project.json
name: "@launchpad/sdk"

extends:
  - "@workspace/omni/presets/ts-vite-lib.omni.yaml"

dependencies:
  append:
    - "@launchpad/tsconfig"
    - "@launchpad/vite-config"
    - "@launchpad/vitest-config"
    - "@launchpad/contracts"

tasks:
  test:unit:
    enabled: true

  test:integration:
    enabled: true

  test:
    enabled: true

  build:
    enabled: true

  publish:
    enabled: false

meta:
  publish: false
