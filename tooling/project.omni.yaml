# yaml-language-server: $schema=https://raw.githubusercontent.com/omni-oss/json-schemas/refs/heads/main/project.json
name: "@launchpad-kit/tooling"
description: Repository-wide tasks that belong to no single package.

# These tasks read the whole repository and finish in well under a second, so they
# are never cached: a stale result is worse than the time saved.
cache:
  enabled: false

tasks:
  test:routing:experiment:
    description: Opt-in disposable Dokku topology and alias-router experiment (Docker, no production settings)
    exec: sh -c 'cd "$(git rev-parse --show-toplevel)" && bun tooling/experiments/routing/run.ts'

  test:acceptance:rehearsal:
    description: Opt-in full-stack P7 rehearsal on disposable PostgreSQL and Dokku (Docker; needs LAUNCHPAD_ACCEPTANCE_REHEARSAL=1)
    exec: sh -c 'cd "$(git rev-parse --show-toplevel)" && bun tooling/experiments/acceptance/run.ts'

  # Talks to a controller and PostgreSQL that you started yourself and runs the controller's
  # admin task; it starts nothing. Pass flags as -a "options=--org acme" (see docs/local-quickstart.md).
  local:seed:
    description: Seed a local controller with an operator, owner, organization, project and CLI profile (needs a running controller)
    exec: sh -c 'cd "$(git rev-parse --show-toplevel)" && bun tooling/local-seed.ts {{ args.options }}'
    args:
      options: ""
    interactive: true

  # Builds, starts and seeds a Compose project on this machine and removes it again; runs
  # Docker (the host socket is mounted into the worker and Dokku). See docs/local-deploy.md.
  local:deploy:
    description: Deploy examples/hello on this machine with the Compose stack; options up, status or down (needs Docker, openssl, ssh-keygen)
    exec: sh -c 'cd "$(git rev-parse --show-toplevel)" && bun tooling/local-deploy.ts {{ args.options }}'
    args:
      options: ""
    interactive: true

  # Starts and removes docker-compose.dev.yaml (PostgreSQL, Mailpit, Dokku, the router) for running
  # the controller, worker and CLI on the host. Docker only; the host socket is mounted into Dokku.
  # See docs/local-dev-infra.md.
  dev:infra:up:
    description: "Start PostgreSQL, Mailpit, Dokku and the router for host development, and write the app settings to .dev-infra/env (needs Docker, ssh-keygen); options --preset app|deploy, --aliases on|off"
    exec: sh -c 'cd "$(git rev-parse --show-toplevel)" && bun tooling/dev-infra.ts up {{ args.options }}'
    args:
      options: ""
    interactive: true

  dev:infra:down:
    description: "Stop the development infrastructure and keep its data (database, Dokku state, credentials, images)"
    exec: sh -c 'cd "$(git rev-parse --show-toplevel)" && bun tooling/dev-infra.ts down {{ args.options }}'
    args:
      options: ""
    interactive: true

  dev:infra:destroy:
    description: "Remove everything the development infrastructure created: sites, containers, volumes, network, images and .dev-infra/"
    exec: sh -c 'cd "$(git rev-parse --show-toplevel)" && bun tooling/dev-infra.ts destroy {{ args.options }}'
    args:
      options: ""
    interactive: true

  dev:infra:status:
    description: "Show the development infrastructure: service health, ports and deployed sites"
    exec: sh -c 'cd "$(git rev-parse --show-toplevel)" && bun tooling/dev-infra.ts status {{ args.options }}'
    args:
      options: ""
    interactive: true

  dev:infra:logs:
    description: "Follow the development infrastructure logs; option --service <name>"
    exec: sh -c 'cd "$(git rev-parse --show-toplevel)" && bun tooling/dev-infra.ts logs {{ args.options }}'
    args:
      options: ""
    interactive: true

  dev:infra:seed:
    description: "Migrate and seed the running host controller with the generated settings (operator, owner, organization, project, key)"
    exec: sh -c 'cd "$(git rev-parse --show-toplevel)" && bun tooling/dev-infra.ts seed {{ args.options }}'
    args:
      options: ""
    interactive: true

  check:format:
    description: Format check of the whole repository, including docs and root files
    exec: sh -c 'cd "$(git rev-parse --show-toplevel)" && bun x oxfmt --check'

  format:
    description: Format the whole repository
    exec: sh -c 'cd "$(git rev-parse --show-toplevel)" && bun x oxfmt'

  check:types:
    description: Type-check the shared tooling (config files, vite and vitest configs, scripts)
    exec: sh -c 'cd "$(git rev-parse --show-toplevel)" && bun x tsc --noEmit -p tsconfig.tooling.json'

  check:lint:
    description: Lint the shared tooling
    exec: sh -c 'cd "$(git rev-parse --show-toplevel)" && bun x oxlint --deny-warnings tooling packages/vite-config packages/vitest-config *.config.ts'

  check:deps:
    description: Package, Omni graph, import and catalog dependencies agree
    exec: sh -c 'cd "$(git rev-parse --show-toplevel)" && bun tooling/check-deps.ts'

  check:compose:
    description: Render docker-compose.yaml and docker-compose.dev.yaml with placeholder settings and assert their shape (needs the Docker CLI; starts nothing)
    # The renderers get a minimal environment, so .env.local never leaks into them.
    exec: sh -c 'cd "$(git rev-parse --show-toplevel)" && bun tooling/compose-production.ts && bun tooling/compose-dev.ts'

  check:compose:rehearsal:
    description: Render and check the disposable aliases-on fixture model (Docker CLI; starts nothing)
    exec: sh -c 'cd "$(git rev-parse --show-toplevel)" && bun tooling/experiments/compose/preflight.ts'

  test:compose:rehearsal:
    description: Opt-in disposable aliases-on Compose baseline (local Docker, host OpenSSL, ssh-keygen and tar)
    exec: sh -c 'cd "$(git rev-parse --show-toplevel)" && bun tooling/experiments/compose/run.ts'

  check:versions:
    description: Every shipped package has the same version and is watched by cog.toml
    exec: sh -c 'cd "$(git rev-parse --show-toplevel)" && bun tooling/versions.ts check'

  check:runtime:
    description: The npm packages (contracts, sdk, cli, mcp, client-core) use no Bun-only API
    exec: sh -c 'cd "$(git rev-parse --show-toplevel)" && bun tooling/runtime-agnostic.ts'

  check:
    description: Types, lint, format, dependency, version and runtime consistency
    exec: ""
    dependencies:
      - check:types
      - check:lint
      - check:format
      - check:deps
      - check:versions
      - check:runtime

  test:unit:
    description: Tests of the repository tooling
    exec: sh -c 'cd "$(git rev-parse --show-toplevel)" && bun test tooling'

  test:
    description: Unit tests
    exec: ""
    dependencies:
      - test:unit

  # Builds, packs and installs the CLI, MCP server and SDK outside the workspace and runs them
  # under Bun and Node (LAUNCHPAD_NODE or `node` on the PATH; required when CI is set).
  # Needs the network for the registry dependencies.
  # Publishes nothing.
  test:packages:
    description: Pack the client packages, install them in a clean project and run them
    exec: sh -c 'cd "$(git rev-parse --show-toplevel)" && bun tooling/check-packages.ts'

  # Builds the controller and worker images and checks and runs them (needs Docker and
  # TEST_DATABASE_URL). Removes what it creates by exact name; pushes nothing; never touches Dokku.
  test:images:
    description: Build the controller and worker images and check them (needs Docker and a test database)
    exec: sh -c 'cd "$(git rev-parse --show-toplevel)" && export TEST_DATABASE_URL="${TEST_DATABASE_URL:-postgres://postgres:dev@127.0.0.1:55432/postgres}" && bun tooling/check-images.ts'

  # A rehearsal of a release that publishes nothing: packs the clients, writes checksums and
  # builds (never pushes) the images into .release-dry-run/. Needs the network and Docker.
  release:dry-run:
    description: Rehearse a release into .release-dry-run/ without publishing anything
    exec: sh -c 'cd "$(git rev-parse --show-toplevel)" && bun tooling/release-dry-run.ts'

  test:db:up:
    description: Start a disposable PostgreSQL for integration tests (needs Docker)
    exec: sh -c 'cd "$(git rev-parse --show-toplevel)" && bun tooling/test-db.ts up'

  test:db:down:
    description: Stop the disposable PostgreSQL
    exec: sh -c 'cd "$(git rev-parse --show-toplevel)" && bun tooling/test-db.ts down'
