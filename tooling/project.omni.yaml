# yaml-language-server: $schema=https://raw.githubusercontent.com/omni-oss/json-schemas/refs/heads/main/project.json
name: "@launchpad-kit/tooling"
description: Repository-wide tasks that belong to no single package.

# These tasks read the whole repository and finish in well under a second, so they
# are never cached: a stale result is worse than the time saved.
cache:
  enabled: false

tasks:
  test:routing:experiment:
    description: Opt-in disposable Dokku topology and alias-router experiment (Docker, no production settings)
    exec: sh -c 'cd "$(git rev-parse --show-toplevel)" && bun tooling/experiments/routing/run.ts'

  test:acceptance:rehearsal:
    description: Opt-in full-stack P7 rehearsal on disposable PostgreSQL and Dokku (Docker; needs LAUNCHPAD_ACCEPTANCE_REHEARSAL=1)
    exec: sh -c 'cd "$(git rev-parse --show-toplevel)" && bun tooling/experiments/acceptance/run.ts'

  check:format:
    description: Format check of the whole repository, including docs and root files
    exec: sh -c 'cd "$(git rev-parse --show-toplevel)" && bun x oxfmt --check'

  format:
    description: Format the whole repository
    exec: sh -c 'cd "$(git rev-parse --show-toplevel)" && bun x oxfmt'

  check:types:
    description: Type-check the shared tooling (config files, vite and vitest configs, scripts)
    exec: sh -c 'cd "$(git rev-parse --show-toplevel)" && bun x tsc --noEmit -p tsconfig.tooling.json'

  check:lint:
    description: Lint the shared tooling
    exec: sh -c 'cd "$(git rev-parse --show-toplevel)" && bun x oxlint --deny-warnings tooling packages/vite-config packages/vitest-config *.config.ts'

  check:deps:
    description: Package, Omni graph, import and catalog dependencies agree
    exec: sh -c 'cd "$(git rev-parse --show-toplevel)" && bun tooling/check-deps.ts'

  check:compose:
    description: Render docker-compose.yaml with placeholder settings and assert its shape (needs the Docker CLI; starts nothing)
    # The renderer gets a minimal environment, so .env.local never leaks into it.
    exec: sh -c 'cd "$(git rev-parse --show-toplevel)" && bun tooling/compose-production.ts'

  check:versions:
    description: Every shipped package has the same version and is watched by cog.toml
    exec: sh -c 'cd "$(git rev-parse --show-toplevel)" && bun tooling/versions.ts check'

  check:
    description: Types, lint, format, dependency and version consistency
    exec: ""
    dependencies:
      - check:types
      - check:lint
      - check:format
      - check:deps
      - check:versions

  test:unit:
    description: Tests of the repository tooling
    exec: sh -c 'cd "$(git rev-parse --show-toplevel)" && bun test tooling'

  test:
    description: Unit tests
    exec: ""
    dependencies:
      - test:unit

  # Builds, packs and installs the CLI, MCP server and SDK outside the workspace and runs them
  # under Bun and Node (when present). Needs the network for the registry dependencies.
  # Publishes nothing.
  test:packages:
    description: Pack the client packages, install them in a clean project and run them
    exec: sh -c 'cd "$(git rev-parse --show-toplevel)" && bun tooling/check-packages.ts'

  # Builds the controller and worker images and checks and runs them (needs Docker and
  # TEST_DATABASE_URL). Removes what it creates by exact name; pushes nothing; never touches Dokku.
  test:images:
    description: Build the controller and worker images and check them (needs Docker and a test database)
    exec: sh -c 'cd "$(git rev-parse --show-toplevel)" && export TEST_DATABASE_URL="${TEST_DATABASE_URL:-postgres://postgres:dev@127.0.0.1:55432/postgres}" && bun tooling/check-images.ts'

  # A rehearsal of a release that publishes nothing: packs the clients, writes checksums and
  # builds (never pushes) the images into .release-dry-run/. Needs the network and Docker.
  release:dry-run:
    description: Rehearse a release into .release-dry-run/ without publishing anything
    exec: sh -c 'cd "$(git rev-parse --show-toplevel)" && bun tooling/release-dry-run.ts'

  test:db:up:
    description: Start a disposable PostgreSQL for integration tests (needs Docker)
    exec: sh -c 'cd "$(git rev-parse --show-toplevel)" && bun tooling/test-db.ts up'

  test:db:down:
    description: Stop the disposable PostgreSQL
    exec: sh -c 'cd "$(git rev-parse --show-toplevel)" && bun tooling/test-db.ts down'
