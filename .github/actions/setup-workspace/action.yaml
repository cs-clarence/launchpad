# Adapted from Pureform's .github/actions/setup-workspace; provenance and MIT
# notice are in .github/NOTICE.md. Playwright is removed: no job runs browser tests.
name: "Setup Workspace"
description: "Install Omni, Bun and dependencies, and restore the Omni cache"

inputs:
  cache-key-prefix:
    description: "Prefix for the Omni cache key"
    required: false
    default: "global"
  cache-restore-key-prefixes:
    description: "Extra whitespace-separated prefixes to restore from"
    required: false
  omni-version:
    description: "Version of Omni to install; keep in step with the version used locally"
    required: false
    default: "0.21.0"
  node-version:
    description: "Node version to install (actions/setup-node syntax)"
    required: false
    default: "lts/*"
  github-token:
    description: "GitHub token for higher rate limit"
    required: false
    default: ${{ github.token }}

runs:
  using: "composite"
  steps:
    - name: Install Omni
      uses: omni-oss/setup-omni@v2
      with:
        github-token: ${{ inputs.github-token }}
        version: ${{ inputs.omni-version }}

    # With no version given, setup-bun reads the root package.json `packageManager`
    # field, so CI uses the Bun version the repository pins.
    - name: Install Bun
      uses: oven-sh/setup-bun@v2

    - name: Install Node
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: Cache Bun install
      uses: actions/cache@v5
      with:
        path: ~/.bun/install/cache
        key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
        restore-keys: |
          ${{ runner.os }}-bun-

    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile

    - name: Get workspace hash
      id: workspace_hash
      shell: bash
      run: echo "hash=$(omni hash -r workspace)" >> "$GITHUB_OUTPUT"

    - name: Create restore key list
      id: restore_keys
      shell: bash
      env:
        PREFIXES: ${{ inputs.cache-restore-key-prefixes }}
        PREFIX: ${{ inputs.cache-key-prefix }}
      run: |
        {
          echo "list<<EOF"
          echo "${RUNNER_OS}-omni-${PREFIX}-"
          for p in $PREFIXES; do echo "${RUNNER_OS}-omni-${p}-"; done
          echo "${RUNNER_OS}-omni-"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Cache Omni directory
      uses: actions/cache@v5
      with:
        path: .omni
        key: ${{ runner.os }}-omni-${{ inputs.cache-key-prefix }}-${{ steps.workspace_hash.outputs.hash }}
        restore-keys: ${{ steps.restore_keys.outputs.list }}
