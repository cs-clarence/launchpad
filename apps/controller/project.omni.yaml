# yaml-language-server: $schema=https://raw.githubusercontent.com/omni-oss/json-schemas/refs/heads/main/project.json
name: "@launchpad-kit/controller"

extends:
  - "@workspace/omni/presets/ts-vite-app.omni.yaml"

dependencies:
  append:
    - "@launchpad-kit/tsconfig"
    - "@launchpad-kit/vite-config"
    - "@launchpad-kit/vitest-config"
    - "@launchpad-kit/services"
    - "@launchpad-kit/auth"
    - "@launchpad-kit/database"
    - "@launchpad-kit/dokku"
    - "@launchpad-kit/contracts"
    - "@launchpad-kit/client-core"
    - "@launchpad-kit/cli"
    - "@launchpad-kit/mcp"

tasks:
  test:unit:
    enabled: true

  # The built server is what the integration tests drive over HTTP.
  test:integration:
    enabled: true
    dependencies:
      append:
        - build

  test:deployment-schema:
    description: Exercise migration 018 and its immutable-model constraints on isolated PostgreSQL databases
    exec: sh -c 'export TEST_DATABASE_URL="${TEST_DATABASE_URL:-postgres://postgres:dev@127.0.0.1:55432/postgres}"; exec bun --bun vitest run --config vitest.config.integration.ts src/admin/__tests__/deployment-model.spec.ts src/admin/__tests__/deployment-cutover.spec.ts'
    dependencies:
      - ^build
    cache:
      enabled: false

  # Frozen previous-schema fixture: backup, built admin migrate, controller restart, restore.
  # Uses the same disposable PostgreSQL as test:integration; never contacts Dokku.
  test:upgrade:
    description: Build the controller image and drill an upgrade and restore against disposable PostgreSQL
    exec: sh -c 'root="$(git rev-parse --show-toplevel)"; tag="launchpad-upgrade-drill-$$:test"; trap "docker image rm \"$tag\" >/dev/null 2>&1 || true" EXIT; export TEST_DATABASE_URL="${TEST_DATABASE_URL:-postgres://postgres:dev@127.0.0.1:55432/postgres}"; docker build -q -f "$root/apps/controller/Dockerfile" -t "$tag" "$root" && LAUNCHPAD_UPGRADE_IMAGE="$tag" bun --bun vitest run --config vitest.config.integration.ts src/admin/__tests__/upgrade.spec.ts'
    dependencies:
      - build
    cache:
      enabled: false

  test:
    enabled: true

  # The route tree (src/routeTree.gen.ts) is generated and git-ignored, so type
  # checking needs a build first; its output is cached with the build.
  build:
    enabled: true
    cache:
      key:
        files:
          append:
            - "public/**/*"
            - "@workspace/packages/database/scripts/**/*"
            - "@workspace/packages/database/src/migrations/**/*"
      output:
        files:
          append:
            - ".output/**/*"
            - "src/routeTree.gen.ts"

  check:types:
    dependencies:
      append:
        - build

  dev:
    description: Start the dashboard dev server on 127.0.0.1 (needs a configured environment)
    exec: bun run dev
    persistent: true
    cache:
      enabled: false

  # Operator commands. Omni's --arg is KEY=value, so the command and its options
  # are named arguments:
  #   omni -i run admin -p @launchpad-kit/controller -a command=migrate
  #   printf '%s' "$PASSWORD" | omni -i run admin -p @launchpad-kit/controller \
  #     -a command=setup -a "options=--email you@example.com"
  # Needs DATABASE_URL (and the LAUNCHPAD_* settings for setup / reset-password).
  admin:
    description: Run an operator command (migrate, backup, verify-backup, restore, check-restore, setup, create-user, reset-password)
    exec: bun run admin {{ args.command }} {{ args.options }}
    args:
      command: "--help"
      options: ""
    interactive: true
    cache:
      enabled: false

meta:
  publish: false
