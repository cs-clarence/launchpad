# yaml-language-server: $schema=https://raw.githubusercontent.com/omni-oss/json-schemas/refs/heads/main/project.json
name: "@launchpad-kit/worker"

extends:
  - "@workspace/omni/presets/ts-vite-app.omni.yaml"

dependencies:
  append:
    - "@launchpad-kit/tsconfig"
    - "@launchpad-kit/vite-config"
    - "@launchpad-kit/vitest-config"
    - "@launchpad-kit/database"
    - "@launchpad-kit/dokku"
    - "@launchpad-kit/services"
    - "@launchpad-kit/alias-router"

tasks:
  test:unit:
    enabled: true

  test:integration:
    enabled: true

  # Opt-in, against a disposable Dokku and Docker you started; never part of `test`
  # or CI, and never cached. See src/__tests__/live.spec.ts for what it touches.
  test:live:
    description: Live tests against a disposable Dokku and Docker (opt-in)
    exec: bun run test:live
    dependencies:
      - ^build
    cache:
      enabled: false

  test:
    enabled: true

  build:
    enabled: true

  publish:
    enabled: false

meta:
  publish: false
