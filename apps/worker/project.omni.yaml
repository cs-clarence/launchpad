# yaml-language-server: $schema=https://raw.githubusercontent.com/omni-oss/json-schemas/refs/heads/main/project.json
name: "@launchpad/worker"

extends:
  - "@workspace/omni/presets/ts-vite-app.omni.yaml"

dependencies:
  append:
    - "@launchpad/tsconfig"
    - "@launchpad/vite-config"
    - "@launchpad/vitest-config"
    - "@launchpad/database"
    - "@launchpad/dokku"
    - "@launchpad/services"

tasks:
  test:unit:
    enabled: true

  test:integration:
    enabled: false

  # Opt-in, against a disposable Dokku and Docker you started; never part of `test`
  # or CI, and never cached. See src/__tests__/live.spec.ts for what it touches.
  test:live:
    description: Live tests against a disposable Dokku and Docker (opt-in)
    exec: bun run test:live
    dependencies:
      - ^build
    cache:
      enabled: false

  test:
    enabled: true

  build:
    enabled: true
    cache:
      key:
        files:
          append:
            - "@workspace/packages/database/scripts/**/*"
            - "@workspace/packages/database/src/migrations/**/*"

  publish:
    enabled: false

meta:
  publish: false
