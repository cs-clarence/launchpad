services:
  dokku:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DOKKU_VERSION: ${DOKKU_VERSION:-0.38.34}
    image: ${LAUNCHPAD_IMAGE:-launchpad/dokku}:${DOKKU_VERSION:-0.38.34}
    container_name: ${DOKKU_CONTAINER_NAME:-dokku}
    network_mode: ${DOKKU_NETWORK_MODE:-bridge}
    restart: ${DOKKU_RESTART_POLICY:-unless-stopped}
    ports:
      - "${DOKKU_BIND_IP:-127.0.0.1}:${DOKKU_SSH_PORT:-3022}:22"
      - "${DOKKU_BIND_IP:-127.0.0.1}:${DOKKU_HTTP_PORT:-9080}:80"
      - "${DOKKU_BIND_IP:-127.0.0.1}:${DOKKU_HTTPS_PORT:-8443}:443"
    environment:
      DOKKU_HOSTNAME: ${DOKKU_HOSTNAME:-example.com}
      # Derived from the mount source so host Docker sees the correct paths.
      DOKKU_HOST_ROOT: ${DOKKU_DATA_DIR:-${PWD}/.data/dokku}/home/dokku
      DOKKU_LIB_HOST_ROOT: ${DOKKU_DATA_DIR:-${PWD}/.data/dokku}/var/lib/dokku
    volumes:
      - ${DOKKU_DATA_DIR:-${PWD}/.data/dokku}:/mnt/dokku
      # Grants Dokku host-level Docker control; trusted deployments only.
      - ${DOCKER_SOCKET_PATH:-/var/run/docker.sock}:/var/run/docker.sock
