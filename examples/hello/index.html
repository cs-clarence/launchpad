<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Launchpad Test Preview</title>
        <style>
            body {
                margin: 0;
                min-height: 100vh;
                display: grid;
                place-items: center;
                background: #111827;

                    18px system-ui,
                    sans-serif;
            }
            main {
                max-width: 36rem;
                padding: 3rem;
            }
            h1 {
                font-size: 3rem;
            }

    <body>
        <main>
            <p>LAUNCHPAD / TEST PREVIEW</p>

            <p>Preview: <code id="hostname">view-demo</code></p>

            document.getElementById("hostname").textContent = window.location.hostname;
        </script>
