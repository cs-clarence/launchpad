# yaml-language-server: $schema=https://raw.githubusercontent.com/omni-oss/json-schemas/refs/heads/main/workspace.json
ui: auto

projects:
  - packages/**
  - apps/**
  - tests/**

generators:
  - source: local
    path: omni/generators/**

projections:
  - id: swe-docs
    source: git
    uri: https://github.com/cs-clarence/swe-docs
    rev: 0e22c39dbc934dd54f90c99dc4a85ec30c004c69
  - id: swe-skills
    source: git
    uri: https://github.com/cs-clarence/swe-skills
    rev: 57fdd47cc8244b24b3dcdde46d6e6cf2e4ee5b39

ignore:
  files:
    - .gitignore
