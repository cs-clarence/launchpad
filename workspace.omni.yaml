# yaml-language-server: $schema=https://raw.githubusercontent.com/omni-oss/json-schemas/refs/heads/main/workspace.json
ui: auto

projects:
  - packages/**
  - apps/**
  - tests/**
  - tooling/**

generators:
  - source: local
    path: omni/generators/**

projections:
  - id: swe-docs
    source: git
    uri: https://github.com/cs-clarence/swe-docs
    rev: 55c6b99914ac2ec3bf0e3e2f5559c18bcccb2dc6
  - id: swe-skills
    source: git
    uri: https://github.com/cs-clarence/swe-skills
    rev: ec0429ca15c5b405367c29ad24095ffd4697837c

ignore:
  files:
    - .gitignore
