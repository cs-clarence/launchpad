# yaml-language-server: $schema=https://raw.githubusercontent.com/omni-oss/json-schemas/refs/heads/main/workspace.json
ui: auto

projects:
  - packages/**
  - apps/**
  - tests/**
  - tooling/**

generators:
  - source: local
    path: omni/generators/**

projections:
  - id: swe-docs
    source: git
    uri: https://github.com/cs-clarence/swe-docs
    rev: main
  - id: swe-skills
    source: git
    uri: https://github.com/cs-clarence/swe-skills
    rev: main

ignore:
  files:
    - .gitignore
